<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Berry Gloss & Co.</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header & Navigation -->
    <header>
        <div class="nav-container">
            <a href="index.html" class="brand-logo">
                <h1>Berry Gloss & Co.</h1>
                <span>Press-On Nails</span>
            </a>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="shop.html">Shop</a></li>
                    <li><a href="contact.html" class="active">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <h2 class="section-title">Contact Us & Feedback</h2>
        
        <div class="contact-container">
            <!-- Social Info -->
            <div class="social-links">
                <h3 style="font-family: 'Playfair Display', serif; color: var(--primary-burgundy); margin-bottom: 1.5rem; font-size: 1.3rem;">Get in Touch</h3>
                <a href="#" class="social-item">Instagram: @berrygloss.co_</a>
                <a href="#" class="social-item"> Tiktok : @berrygloss.co_</a>
                <a href="#" class="social-item">Whatsapp : +6016-9544127</a>
            </div>

            <!-- Survey Form -->
            <div class="survey-card">
                <h3>Customer Feedback Survey</h3>
                <form>
                    <div class="form-group">
                        <label>Your email</label>
                        <input type="email" class="form-control" placeholder="name@example.com">
                    </div>
                    <div class="form-group">
                        <label>How would you rate our service overall?</label>
                        <div class="rating-options">
                            <button type="button" class="rating-btn">😠</button>
                            <button type="button" class="rating-btn">🙁</button>
                            <button type="button" class="rating-btn">😐</button>
                            <button type="button" class="rating-btn">😊</button>
                            <button type="button" class="rating-btn">😍</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Please share the reason for your rating</label>
                        <textarea class="form-control" rows="3" placeholder="Tell us what you think..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-submit">Submit Feedback</button>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <header style="margin-top: auto; padding: 1rem 2rem; text-align: center; font-size: 0.8rem;">
        <p>Berry Gloss & Co. &copy; 2026. All Rights Reserved.</p>
    </header>

</body>
</html>
